<script>
const MODES = {
  black: { bg: '0 0 0', card: '14 14 17', sunk: '0 0 0', line: '42 42 50', ink: '244 244 245', mute: '161 161 170', faint: '113 113 122', good: '52 211 153', bad: '251 113 133', warn: '251 191 36', scheme: 'dark', label: 'Black' },
  dark:  { bg: '11 16 32', card: '19 26 46', sunk: '9 13 26', line: '38 48 74', ink: '232 236 246', mute: '154 166 192', faint: '102 114 143', good: '52 211 153', bad: '251 113 133', warn: '251 191 36', scheme: 'dark', label: 'Dark' },
  light: { bg: '243 245 249', card: '255 255 255', sunk: '241 243 248', line: '218 223 234', ink: '17 24 39', mute: '75 85 99', faint: '107 114 128', good: '5 150 105', bad: '220 38 38', warn: '180 83 9', scheme: 'light', label: 'Light' }
};
const ACCENTS = { purple: '#8b5cf6', blue: '#3b82f6', green: '#22c55e', red: '#ef4444', pink: '#ec4899', orange: '#f97316', yellow: '#eab308', teal: '#14b8a6' };
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
  return [h, s, l];
}
function hslToRgb(h, s, l) {
  if (s === 0) { const v = Math.round(l * 255); return [v, v, v]; }
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return [Math.round(f(h + 1 / 3) * 255), Math.round(f(h) * 255), Math.round(f(h - 1 / 3) * 255)];
}
function getTheme() {
  let t = {}; try { t = JSON.parse(localStorage.getItem('rca.theme') || '{}'); } catch {}
  return { mode: MODES[t.mode] ? t.mode : 'dark', accent: /^#[0-9a-f]{6}$/i.test(t.accent || '') ? t.accent : ACCENTS.purple };
}
function applyTheme(t) {
  const m = MODES[t.mode], root = document.documentElement.style;
  ['bg', 'card', 'sunk', 'line', 'ink', 'mute', 'faint', 'good', 'bad', 'warn'].forEach(k => root.setProperty('--' + k, m[k]));
  const [r, g, b] = hexToRgb(t.accent);
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  const [h, s, l] = rgbToHsl(r, g, b);
  const tx = hslToRgb(h, s, m.scheme === 'light' ? Math.min(l, .38) : Math.max(l, .68));
  root.setProperty('--accent', r + ' ' + g + ' ' + b);
  root.setProperty('--accent-ink', lum > .55 ? '17 24 39' : '255 255 255');
  root.setProperty('--accent-text', tx.join(' '));
  document.documentElement.style.colorScheme = m.scheme;
  const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.content = 'rgb(' + m.bg.split(' ').join(',') + ')';
}
function saveTheme(t) { try { localStorage.setItem('rca.theme', JSON.stringify(t)); } catch {} applyTheme(t); }
applyTheme(getTheme());
</script>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const LETTERS = 'ABCDEFGHIJKL';
const fmt = n => Number.isInteger(n) ? n : +n.toFixed(2);
const fmtDur = s => { s = Math.round(s); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's'; };
const fmtDate = iso => new Date(iso).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'fixed left-1/2 -translate-x-1/2 bottom-6 z-[60] max-w-[90vw] px-4 py-3 rounded-xl text-sm shadow-xl border bg-card ' + (type === 'error' ? 'border-bad text-bad' : 'border-line text-ink');
  t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 4200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}
const badge = (txt, kind) => `<span class="chip font-semibold text-${kind}" style="border-color:rgb(var(--${kind}) / .4);background:rgb(var(--${kind}) / .1)">${esc(txt)}</span>`;
const toLocalInput = iso => { if (!iso) return ''; const d = new Date(iso); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };

/* ---------- SHA-256 (pure JS, used for the teacher password hash) ---------- */
const sha256 = (() => {
  const P = []; for (let n = 2; P.length < 64; n++) { let ok = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { ok = false; break; } if (ok) P.push(n); }
  const fr = x => Math.floor((x - Math.floor(x)) * 4294967296);
  const K = new Uint32Array(P.map(p => fr(Math.cbrt(p))));
  const H0 = new Uint32Array(P.slice(0, 8).map(p => fr(Math.sqrt(p))));
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  return function (msg) {
    const l = msg.length, total = ((l + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(total); buf.set(msg); buf[l] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total - 4, (l * 8) >>> 0); dv.setUint32(total - 8, Math.floor(l * 8 / 4294967296));
    const h = new Uint32Array(H0), w = new Uint32Array(64);
    for (let o = 0; o < total; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const a = w[i - 15], b = w[i - 2];
        w[i] = w[i - 16] + (ror(a, 7) ^ ror(a, 18) ^ (a >>> 3)) + w[i - 7] + (ror(b, 17) ^ ror(b, 19) ^ (b >>> 10));
      }
      let a = h[0], b = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
        const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h[0] += a; h[1] += b; h[2] += c; h[3] += d; h[4] += e; h[5] += f; h[6] += g; h[7] += hh;
    }
    const out = new Uint8Array(32), ov = new DataView(out.buffer);
    for (let i = 0; i < 8; i++) ov.setUint32(i * 4, h[i]);
    return out;
  };
})();
const toHex = u => Array.from(u, b => b.toString(16).padStart(2, '0')).join('');
function hashPw(pw) {
  let h = sha256(new TextEncoder().encode(CONFIG.HASH_SALT + ':' + pw));
  for (let i = 0; i < CONFIG.HASH_ROUNDS; i++) h = sha256(h);
  return toHex(h);
}

/* ---------- state ---------- */
let settings = Object.assign({ webhook: '' }, LS.get('rca.settings', {}));
if (!settings.webhook) settings.webhook = CONFIG.WEBHOOK_URL || '';
let results = LS.get('rca.results', []);
let pending = LS.get('rca.pending', []);
let view = 'home', lastView = '';
let attempt = null;       // the student's quiz in progress (includes a copy of the questions)
let lastReview = null;
let unlocked = false, teacherPw = '';
let timerId = null, beatId = null, typeTimer = 0;
let deferredInstall = null;
let leaveStart = null;

// student screen
let classesData = LS.get('rca.classes', null), classesErr = '', classesLoading = false;
let stuName = LS.get('rca.stuName', ''), stuClass = LS.get('rca.stuClass', ''), starting = '';
// teacher screens
let adminData = null, adminErr = '', adminLoading = false;
let newClassName = '', classViewName = '', connMsg = '', draft = null, classRes = {};

const API = () => (settings.webhook || '').trim();
const saveSettings = () => LS.set('rca.settings', settings);
const saveAttempt = () => { if (attempt) LS.set('rca.attempt', attempt); };
const dlTime = hw => hw && hw.deadline ? new Date(hw.deadline).getTime() : 0;
const isPast = hw => !!(dlTime(hw) && Date.now() > dlTime(hw));
const isClosed = hw => isPast(hw) && !hw.allowLate;

/* ---------- talking to the Google script ---------- */
function friendlyErr(e) {
  const m = String((e && e.message) || e);
  if (m === 'not-connected') return 'The app is not connected to a Google Sheet yet.';
  if (e instanceof TypeError || /JSON|Unexpected token|Unexpected end|Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'Could not get a proper reply from Google. Check your connection, the web app URL, that access is set to "Anyone", and that you pasted the newest script and deployed it as a new version.';
  return m;
}
async function apiGet(params) {
  const base = API(); if (!base) throw new Error('not-connected');
  const r = await fetch(base + (base.includes('?') ? '&' : '?') + new URLSearchParams(params).toString());
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Request failed');
  return j;
}
async function apiPost(body) {
  const base = API(); if (!base) throw new Error('not-connected');
  const r = await fetch(base, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Request failed');
  return j;
}
const admin = (action, data) => apiPost(Object.assign({ action, pw: teacherPw }, data || {}));

/* ---------- Excel / sheet parsing ---------- */
// Answers are MATCHED, not just lettered. The Answer cell can hold:
//   - the text of the correct option (a word, a number, True / False / Not Given), or a letter A-H
//   - for a row with no options: True / False / Not Given (or Yes / No / Not Given), or a typed answer
//     (a number or word). Several accepted typed answers are separated with |
const SHORT_FORMS = { t: 'true', f: 'false', ng: 'not given', 'n/g': 'not given', y: 'yes', n: 'no' };
const NOT_GIVEN = ['not given', 'notgiven', 'ng', 'n/g'];

// lower case, tidy spaces / quotes / dashes, drop punctuation at the edges
function normAns(s) {
  return String(s === null || s === undefined ? '' : s).normalize('NFKC').toLowerCase()
    .replace(/[‘’‛]/g, "'").replace(/[“”]/g, '"').replace(/[‐-―]/g, '-')
    .replace(/\s+/g, ' ').trim()
    .replace(/^[\s"'(\[{]+|[\s"'.,;:!?)\]}]+$/g, '');
}
// "1,000" and "4.0" count as numbers; anything else is NaN
function numOf(s) {
  const t = String(s).replace(/\s/g, '');
  if (/^[-+]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t) || /^[-+]?\d+(\.\d+)?$/.test(t)) return parseFloat(t.replace(/,/g, ''));
  return NaN;
}
function sameAnswer(a, b) {
  const x = normAns(a), y = normAns(b);
  if (!x || !y) return false;
  if (x === y) return true;
  const nx = numOf(x), ny = numOf(y);
  return Number.isFinite(nx) && Number.isFinite(ny) && nx === ny;
}
const isNotGiven = s => NOT_GIVEN.includes(normAns(s));
// what kind of "no options" answer is this? 'tf' (True/False), 'yn' (Yes/No), 'ng' (Not Given) or '' (typed answer)
function implicitKind(raw) {
  const n = normAns(raw);
  if (['true', 'false', 't', 'f'].includes(n)) return 'tf';
  if (['yes', 'no', 'y', 'n'].includes(n)) return 'yn';
  if (NOT_GIVEN.includes(n)) return 'ng';
  return '';
}
// position written as a letter (A-H, "Option B") or a number (1-8, "Option 2"); -1 if it isn't one
function posOf(raw) {
  const m = String(raw).trim().match(/^(?:option|choice|opt)?[\s_.\-]*([a-h]|[1-8])[.)]?$/i);
  if (!m) return -1;
  const ch = m[1].toLowerCase();
  return /\d/.test(ch) ? parseInt(ch, 10) - 1 : ch.charCodeAt(0) - 97;
}
// Finds which option an Answer cell means. Order: the option's own text (words, numbers), then
// True/False/Yes/No/Not Given short forms, then a letter position (A-H), or a number position when the sheet answers with letters.
function resolveAnswer(raw, list, letterMode) {
  if (!raw) return { k: -1 };
  // a letter (B, "Option C") always counts as a position; a number (2, "Option 2") only in a sheet that answers with letters
  const byPosIndex = () => {
    const p = posOf(raw);
    if (p < 0 || (/\d/.test(raw) && !letterMode)) return -1;
    return list.findIndex(o => o.pos === p);
  };
  const byText = list.findIndex(o => sameAnswer(o.text, raw));
  if (byText >= 0) {
    const kp = byPosIndex();
    return { k: byText, amb: kp >= 0 && kp !== byText };
  }
  const full = SHORT_FORMS[normAns(raw)];
  if (full) {
    const k = list.findIndex(o => normAns(o.text) === full || (full === 'not given' && isNotGiven(o.text)));
    if (k >= 0) return { k };
  }
  return { k: byPosIndex() };
}

function parseRows(rows) {
  if (!rows || rows.length < 2) throw new Error('The sheet needs a header row plus at least one question.');
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const qCol = head.findIndex(h => /^q(uestion)?s?\b/.test(h));
  const aCol = head.findIndex(h => /^(correct|answer|key|ans)\b/.test(h));
  const pCol = head.findIndex(h => /^(points?|marks?)\b/.test(h));
  const optCols = [];
  head.forEach((h, i) => { if (i !== qCol && i !== aCol && i !== pCol && /^(?:option|choice|opt)?[\s_.\-]*([a-h]|[1-8])$/.test(h)) optCols.push(i); });
  if (qCol < 0) throw new Error('Could not find a "Question" column in row 1.');
  if (aCol < 0) throw new Error('Could not find an "Answer" column in row 1.');

  const data = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const text = String(r[qCol] ?? '').trim();
    if (!text) continue;
    const list = [];
    optCols.forEach((c, pos) => { const t = String(r[c] ?? '').trim(); if (t) list.push({ text: t, pos }); });
    let pts = pCol >= 0 ? parseFloat(r[pCol]) : 1;
    if (!(pts > 0)) pts = 1;
    data.push({ n: i + 1, text, list, raw: String(r[aCol] ?? '').trim(), pts });
  }

  // facts about the whole sheet
  const answered = data.filter(d => d.raw);
  const letterMode = answered.length > 0 && answered.filter(d => /^(?:option|choice|opt)?[\s_.\-]*[a-h][.)]?$/i.test(d.raw)).length / answered.length >= 0.5;
  const bare = data.filter(d => d.list.length === 0 && d.raw);        // rows with no options
  const hasNG = bare.some(d => implicitKind(d.raw) === 'ng');
  const hasYN = bare.some(d => implicitKind(d.raw) === 'yn');
  const hasTF = bare.some(d => implicitKind(d.raw) === 'tf');
  const family = hasYN && !hasTF ? ['Yes', 'No'] : ['True', 'False'];
  const choiceWords = family.concat(hasNG ? ['Not Given'] : []);
  const mcRows = data.filter(d => d.list.length >= 2).length;

  const questions = [], warnings = [], typedRows = [];
  let nMc = 0, nAuto = 0, nText = 0;
  data.forEach(d => {
    if (!d.raw) { warnings.push(`Row ${d.n}: no answer, skipped.`); return; }
    if (d.list.length >= 2) {
      const { k, amb } = resolveAnswer(d.raw, d.list, letterMode);
      if (k < 0) { warnings.push(`Row ${d.n}: answer "${d.raw}" doesn't match any option, skipped. Spell it exactly like one of the options, or use a letter (A, B, C…).`); return; }
      if (amb) warnings.push(`Row ${d.n}: answer "${d.raw}" matches an option's text and also an option position. Used the option text "${d.list[k].text}". Use a letter (A, B, C…) if you meant the position.`);
      questions.push({ type: 'mc', q: d.text, options: d.list.map(o => o.text), answer: k, points: d.pts }); nMc++;
    } else if (d.list.length === 1) {
      warnings.push(`Row ${d.n}: only one option, skipped. Give at least two, or leave them all blank.`);
    } else if (implicitKind(d.raw)) {
      const opts = choiceWords.map((t, pos) => ({ text: t, pos }));
      const { k } = resolveAnswer(d.raw, opts, false);
      if (k < 0) { warnings.push(`Row ${d.n}: answer "${d.raw}" isn't one of ${choiceWords.join(' / ')}, skipped.`); return; }
      questions.push({ type: 'mc', q: d.text, options: choiceWords.slice(), answer: k, points: d.pts }); nAuto++;
    } else {
      const answers = splitAlts(d.raw);
      if (!answers.length) { warnings.push(`Row ${d.n}: answer "${d.raw}" isn't usable, skipped.`); return; }
      questions.push({ type: 'text', q: d.text, options: [], answers, points: d.pts }); nText++; typedRows.push(d.n);
    }
  });
  // a typed-answer row in a sheet that is otherwise multiple choice is probably a forgotten set of options
  if (mcRows > 0 && typedRows.length) {
    warnings.push(`Row${typedRows.length > 1 ? 's' : ''} ${typedRows.slice(0, 12).join(', ')}${typedRows.length > 12 ? '…' : ''}: no options, so students will TYPE the answer. If you meant multiple choice, fill in the options.`);
  }
  const parts = [];
  if (nMc) parts.push(`${nMc} multiple choice`);
  if (nAuto) parts.push(`${nAuto} ${choiceWords.join(' / ')} (options added for you)`);
  if (nText) parts.push(`${nText} typed answer${nText > 1 ? 's' : ''}`);
  return { questions, warnings, summary: parts.join(' · ') };
}

// Alternative accepted answers are separated with | (or a semicolon or new line)
const splitAlts = raw => String(raw).split(/\s*[|;\n]\s*/).map(s => s.trim()).filter(s => normAns(s));

// The SHORT ANSWERS tab: Question / Answer / Points. Every row is a question the student types the answer to.
function parseShort(rows) {
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const qCol = head.findIndex(h => /^q(uestion)?s?\b/.test(h));
  const aCol = head.findIndex(h => /^(correct|answer|key|ans)\b/.test(h));
  const pCol = head.findIndex(h => /^(points?|marks?)\b/.test(h));
  if (qCol < 0) throw new Error('Could not find a "Question" column in row 1.');
  if (aCol < 0) throw new Error('Could not find an "Answer" column in row 1.');
  const questions = [], warnings = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i], n = i + 1;
    const text = String(r[qCol] ?? '').trim();
    if (!text) continue;
    const raw = String(r[aCol] ?? '').trim();
    if (!raw) { warnings.push(`Row ${n}: no answer, skipped.`); continue; }
    const answers = splitAlts(raw);
    if (!answers.length) { warnings.push(`Row ${n}: answer "${raw}" isn't usable, skipped.`); continue; }
    if (answers.length > 10) { warnings.push(`Row ${n}: more than 10 accepted answers, skipped.`); continue; }
    if (answers.some(a => a.length > 300) || text.length > 2000) { warnings.push(`Row ${n}: the question or an answer is too long, skipped.`); continue; }
    let pts = pCol >= 0 ? parseFloat(r[pCol]) : 1;
    if (!(pts > 0)) pts = 1;
    questions.push({ type: 'text', q: text, options: [], answers, points: pts });
  }
  return { questions, warnings };
}

const wordCount = t => (String(t).trim().match(/\S+/g) || []).length;

// The PASSAGE tab: one row per paragraph (or one cell with blank lines between paragraphs).
// Optional columns: Page (to choose the pages yourself), Label (A, B, C... for matching questions), Title.
// Without a Page column the text is split into pages of about 220 words, never in the middle of a paragraph.
function parsePassage(rows) {
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const tCol = head.findIndex(h => /^(text|passage|paragraphs?|content|body)\b/.test(h));
  const pCol = head.findIndex(h => /^page\b/.test(h));
  const lCol = head.findIndex(h => /^(label|para(graph)?\s*(id|label|no|number)?)$/.test(h) && !/^(text|paragraphs?)$/.test(h));
  const ttCol = head.findIndex(h => /^title\b/.test(h));
  if (tCol < 0) throw new Error('Could not find a "Text" column in row 1.');
  let title = '';
  const paras = [];     // { text, label, page }
  let curPage = '1';
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (ttCol >= 0 && !title) title = String(r[ttCol] ?? '').trim();
    if (pCol >= 0 && String(r[pCol] ?? '').trim() !== '') curPage = String(r[pCol]).trim();
    const cell = String(r[tCol] ?? '').replace(/\r/g, '');
    if (!cell.trim()) continue;
    const label = lCol >= 0 ? String(r[lCol] ?? '').trim().slice(0, 4) : '';
    cell.split(/\n\s*\n/).map(x => x.replace(/\s*\n\s*/g, ' ').replace(/[ \t]+/g, ' ').trim()).filter(Boolean).forEach((text, k) => paras.push({ text, label: k === 0 ? label : '', page: curPage }));
  }
  if (!paras.length) throw new Error('The passage is empty.');
  if (paras.length > 60) throw new Error('The passage has more than 60 paragraphs.');
  const pages = [];
  if (pCol >= 0 && rows.slice(1).some(r => String(r[pCol] ?? '').trim() !== '')) {
    const byKey = new Map();
    paras.forEach(p => { if (!byKey.has(p.page)) { byKey.set(p.page, []); pages.push(byKey.get(p.page)); } byKey.get(p.page).push(p); });
  } else {
    let cur = [], w = 0;
    paras.forEach(p => {
      const pw = wordCount(p.text);
      if (cur.length && (w >= 220 || w + pw > 330)) { pages.push(cur); cur = []; w = 0; }
      cur.push(p); w += pw;
    });
    if (cur.length) pages.push(cur);
  }
  const alpha = i => (i < 26 ? String.fromCharCode(65 + i) : String(i + 1));
  const flat = pages.flat();
  return {
    title, words: flat.reduce((n, p) => n + wordCount(p.text), 0),
    pages: pages.map(pg => pg.map(p => p.text).join('\n\n')),
    paraLabels: flat.map((p, i) => p.label || alpha(i))
  };
}

// The MATCHING tab: Question | Answer | Points | Options. The Options column is ONE shared list of choices (e.g. the headings).
// Each question gets the whole list as a drop-down; its Answer is the right choice (by its text, or by letter A, B, C... in list order).
function parseMatching(rows) {
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const qCol = head.findIndex(h => /^q(uestion)?s?\b|^(item|paragraph|statement)s?\b/.test(h));
  const aCol = head.findIndex(h => /^(correct|answer|key|ans)\b/.test(h));
  const pCol = head.findIndex(h => /^(points?|marks?)\b/.test(h));
  const oCol = head.findIndex(h => /^(options?|choices?|headings?|list)\b/.test(h));
  if (qCol < 0) throw new Error('Could not find a "Question" column in row 1.');
  if (aCol < 0) throw new Error('Could not find an "Answer" column in row 1.');
  if (oCol < 0) throw new Error('Could not find an "Options" column in row 1. Put the list of choices (for example the headings) in it, one per row.');
  const opts = []; const seen = new Set();
  for (let i = 1; i < rows.length; i++) {
    const t = String(rows[i][oCol] ?? '').trim();
    if (t && !seen.has(normAns(t))) { seen.add(normAns(t)); opts.push(t); }
  }
  if (opts.length < 2 || opts.length > 12) throw new Error(`The Options column needs between 2 and 12 choices (it has ${opts.length}).`);
  const list = opts.map((text, pos) => ({ text, pos }));
  const data = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i]; const text = String(r[qCol] ?? '').trim();
    if (text) data.push({ n: i + 1, text, raw: String(r[aCol] ?? '').trim(), pts: (() => { const p = pCol >= 0 ? parseFloat(r[pCol]) : 1; return p > 0 ? p : 1; })() });
  }
  const answered = data.filter(d => d.raw);
  const letterMode = answered.length > 0 && answered.filter(d => /^[a-l][.)]?$/i.test(d.raw)).length / answered.length >= 0.5;
  const questions = [], warnings = [];
  data.forEach(d => {
    if (!d.raw) { warnings.push(`Row ${d.n}: no answer, skipped.`); return; }
    let k = list.findIndex(o => sameAnswer(o.text, d.raw));
    if (k < 0 && letterMode) { const m = d.raw.match(/^([a-l])[.)]?$/i); if (m) { const p = m[1].toLowerCase().charCodeAt(0) - 97; if (p < list.length) k = p; } }
    if (k < 0) { warnings.push(`Row ${d.n}: answer "${d.raw}" isn't one of the Options, skipped. Copy it exactly from the Options column, or use a letter (A, B, C...).`); return; }
    questions.push({ type: 'mc', q: d.text, options: opts.slice(), answer: k, points: d.pts, style: 'match' });
  });
  return { questions, warnings };
}

const tfFamily = q => q.type === 'mc' && q.options.length >= 2 && q.options.length <= 3 && q.options.every(o => ['true', 'false', 'not given', 'yes', 'no'].includes(normAns(o)));
function sectionTitle(qs) {
  const set = new Set(qs[0].options.map(o => normAns(o)));
  const ng = set.has('not given');
  if (set.has('yes')) return ng ? 'Yes / No / Not Given' : 'Yes / No';
  if (set.has('true')) return ng ? 'True / False / Not Given' : 'True / False';
  return 'Multiple choice';
}

// Everything in a quiz file that has tabs. t = { rows (MULTI-CHOICE), matchRows, shortRows, passageRows }
// Returns the questions in order (multiple choice, matching, short answers), the sections they fall in, and the passage if there is one.
function parseTabs(t) {
  const questions = [], warnings = [], parts = [], sections = [];
  let passage = null;
  const addSection = (title, style, from) => { if (questions.length > from) sections.push({ title, start: from + 1, end: questions.length, style }); };
  if (t.passageRows && t.passageRows.length >= 2) {
    try { passage = parsePassage(t.passageRows); } catch (e) { throw new Error('PASSAGE tab: ' + e.message); }
    const p = passage.pages.length;
    parts.push(`passage of ${passage.words} words on ${p} page${p > 1 ? 's' : ''}`);
  }
  if (t.rows && t.rows.length >= 2) {
    let r;
    try { r = parseRows(t.rows); } catch (e) { throw new Error('MULTI-CHOICE tab: ' + e.message); }
    r.warnings.forEach(w => warnings.push('MULTI-CHOICE ' + w.replace(/^Row/, 'row')));
    // runs of True/False/Not Given questions and of ordinary multiple choice become their own sections
    let run = [];
    const flush = () => { if (run.length) { const from = questions.length; questions.push(...run); addSection(sectionTitle(run), '', from); run = []; } };
    r.questions.forEach(q => { if (q.type !== 'mc') { flush(); const from = questions.length; questions.push(q); addSection('Short answers', '', from); return; } if (run.length && tfFamily(run[0]) !== tfFamily(q)) flush(); run.push(q); });
    flush();
    if (r.summary) parts.push(r.summary);
  }
  if (t.matchRows && t.matchRows.length >= 2) {
    let r;
    try { r = parseMatching(t.matchRows); } catch (e) { throw new Error('MATCHING tab: ' + e.message); }
    r.warnings.forEach(w => warnings.push('MATCHING ' + w.replace(/^Row/, 'row')));
    const from = questions.length; questions.push(...r.questions); addSection('Matching', 'match', from);
    if (r.questions.length) parts.push(`${r.questions.length} matching`);
  }
  if (t.shortRows && t.shortRows.length >= 2) {
    let r;
    try { r = parseShort(t.shortRows); } catch (e) { throw new Error('SHORT ANSWERS tab: ' + e.message); }
    r.warnings.forEach(w => warnings.push('SHORT ANSWERS ' + w.replace(/^Row/, 'row')));
    const from = questions.length; questions.push(...r.questions); addSection('Short answers', '', from);
    if (r.questions.length) parts.push(`${r.questions.length} short answer${r.questions.length > 1 ? 's' : ''}`);
  }
  return { questions, warnings, summary: parts.join(' · '), passage, sections, twoTab: true };
}
// kept for the two-tab quiz (MULTI-CHOICE + SHORT ANSWERS)
const parseTwoTab = (mcRows, shortRows) => parseTabs({ rows: mcRows, shortRows });

// is the student's answer g right for question q? (g is an option number for multiple choice, typed text otherwise)
const isRight = (q, g) => g !== undefined && (q.type === 'text' ? q.answers.some(a => sameAnswer(g, a)) : g === q.answer);

function parseWorkbook(buf) {
  const wb = XLSX.read(buf, { type: 'array' });
  const rowsOf = n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' });
  const find = re => wb.SheetNames.find(n => re.test(n));
  const mcName = find(/multi|choice/i), saName = find(/short/i), psName = find(/passage/i) || find(/^reading/i), mtName = find(/match/i);
  if (mcName || saName || psName || mtName) return parseTabs({ rows: mcName ? rowsOf(mcName) : [], shortRows: saName ? rowsOf(saName) : [], matchRows: mtName ? rowsOf(mtName) : [], passageRows: psName ? rowsOf(psName) : [] });
  return parseRows(rowsOf(wb.SheetNames[0]));
}
function downloadTemplate() {
  const aoa = [
    ['Question', 'Option A', 'Option B', 'Option C', 'Option D', 'Answer', 'Points'],
    ['What is the capital of France?', 'Berlin', 'Paris', 'Madrid', 'Rome', 'Paris', 1],
    ['2 + 2 = ?', '3', '4', '5', '22', '4', 1],
    ['The Earth orbits the Sun.', 'True', 'False', 'Not Given', '', 'True', 1],
    ['The writer says cats are friendly.', '', '', '', '', 'Not Given', 1]
  ];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 44 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 14 }, { wch: 8 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Quiz');
  XLSX.writeFile(wb, 'quiz-template.xlsx');
}

/* ---------- sending a student's result ---------- */
const payloadOf = r => ({ id: r.id, timestamp: r.timestamp, name: r.name, 'class': r.cls || '', hwId: r.hwId || '', quiz: r.quiz, score: r.score, total: r.total, percent: r.percent, correct: r.correct, questions: r.questions, seconds: r.seconds, late: !!r.late, deadline: r.deadline || '', integrity: r.integrity || null, log: r.log || [], answers: r.answers || [], kind: r.kind || 'quiz', timing: r.timing || null, essay: r.essay || null });
async function sendResult(rec) {
  if (!API()) return 'nohook';
  const opts = { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payloadOf(rec)) };
  let resp = null;
  try { resp = await fetch(API(), opts); } catch { resp = null; }
  if (resp) {
    // Google answered: only call it sent if the script says it saved the result
    try { const j = await resp.json(); return j.ok ? 'sent' : 'failed'; } catch { return 'failed'; }
  }
  // No readable reply (offline, or the browser hid it). Try once without needing a reply:
  // if that gets out it counts as sent, and the script ignores a repeat of the same result.
  try { await fetch(API(), Object.assign({}, opts, { mode: 'no-cors' })); return 'sent'; } catch { return 'failed'; }
}
async function deliver(rec) {
  setStatus('sending');
  const r = await sendResult(rec);
  if (r === 'sent') { rec.sent = true; pending = pending.filter(p => p.id !== rec.id); }
  else if (r === 'failed' && !pending.some(p => p.id === rec.id)) pending.push(rec);
  LS.set('rca.results', results); LS.set('rca.pending', pending);
  setStatus(r);
}
async function retryPending() {
  if (!API() || !pending.length) return;
  for (const rec of pending.slice()) {
    const r = await sendResult(rec);
    if (r === 'sent') { pending = pending.filter(p => p.id !== rec.id); const row = results.find(x => x.id === rec.id); if (row) row.sent = true; }
  }
  LS.set('rca.results', results); LS.set('rca.pending', pending);
  if (view === 'home') render();
}
function setStatus(state) {
  const el = $('#sendStatus'); if (!el) return;
  const map = {
    sending: ['text-mute', 'Sending your score…'],
    sent: ['text-good', '✓ Your score and answers were sent to your teacher.'],
    nohook: ['text-warn', 'Your score is saved on this device. The app is not connected to a Google Sheet yet.'],
    failed: ['text-warn', "Couldn't send right now. Your score is saved and will retry automatically."]
  };
  const [cls, txt] = map[state];
  el.className = 'mt-6 text-sm ' + cls;
  el.innerHTML = esc(txt) + (state === 'failed' ? ' <button data-act="retryNow" class="underline font-semibold">Retry now</button>' : '');
}

/* ---------- Google Apps Script (paste into the Sheet) ---------- */
const APPS_SCRIPT = '';
// The Copy button fills in your teacher password so you don't have to edit the script by hand.
function scriptWithPassword() {
  return teacherPw ? APPS_SCRIPT.replace("'YOUR_PASSWORD_HERE'", () => JSON.stringify(teacherPw)) : APPS_SCRIPT;
}

/* ---------- integrity tracking ---------- */
const newStats = () => ({ leaves: 0, awayMs: 0, copies: 0, pastes: 0, menus: 0, prints: 0, resumes: 0 });
const tracking = () => view === 'quiz' && attempt && !attempt.done;
function ev(type, detail) {
  if (!attempt || attempt.done) return;
  if (attempt.log.length < 300) attempt.log.push({ t: Math.round((Date.now() - attempt.startedAt) / 1000), type, detail: detail || '' });
  saveAttempt();
}
function onLeave(why) {
  if (!tracking() || leaveStart) return;
  leaveStart = Date.now(); attempt.stats.leaves++; ev('left page', why);
}
function onReturn() {
  if (!tracking() || !leaveStart) return;
  const d = Date.now() - leaveStart; leaveStart = null;
  attempt.stats.awayMs += d; ev('came back', 'away ' + fmtDur(d / 1000));
}
function resumeAttempt() {
  const away = Date.now() - (attempt.lastSeen || Date.now());
  if (away > 6000) {
    attempt.stats.leaves++; attempt.stats.resumes++; attempt.stats.awayMs += away;
    ev('closed or left quiz, then resumed', 'away ' + fmtDur(away / 1000));
  }
  attempt.lastSeen = Date.now(); saveAttempt();
}
function integrityOf(a, seconds) {
  const s = a.stats, parts = [];
  if (s.leaves) parts.push(`Left the page ${s.leaves}× (${fmtDur(s.awayMs / 1000)} away)`);
  if (s.copies) parts.push(`copy/cut attempt ${s.copies}×`);
  if (s.pastes) parts.push(`paste ${s.pastes}×`);
  if (s.prints) parts.push(`print/save/screenshot key ${s.prints}×`);
  if (s.resumes) parts.push(`closed or reloaded and resumed ${s.resumes}×`);
  const n = a.order.length, fast = n >= 5 && seconds / n < 2.5;
  if (fast) parts.push(`finished unusually fast (${fmtDur(seconds)} for ${n} questions)`);
  const minor = s.menus ? `right-click ${s.menus}×` : '';
  return { flagged: parts.length > 0, summary: (parts.concat(minor ? [minor] : [])).join('; ') || 'No issues detected', leaves: s.leaves, awaySeconds: Math.round(s.awayMs / 1000), copies: s.copies, pastes: s.pastes, prints: s.prints, rightClicks: s.menus, resumes: s.resumes, fast };
}
function installGuards() {
  document.addEventListener('visibilitychange', () => document.hidden ? onLeave('tab hidden or app switched') : onReturn());
  window.addEventListener('blur', () => onLeave('window lost focus'));
  window.addEventListener('focus', onReturn);
  // While the window is covered or in the background, blur the quiz (app-switcher previews, overlays, split screen)
  const cover = on => document.body.classList.toggle('cover', !!on && tracking());
  document.addEventListener('visibilitychange', () => cover(document.hidden));
  window.addEventListener('blur', () => cover(true));
  window.addEventListener('focus', () => cover(false));
  // Closing the tab or pressing Back during a quiz asks first
  window.addEventListener('beforeunload', e => { if (tracking()) { e.preventDefault(); e.returnValue = ''; return ''; } });
  window.addEventListener('popstate', () => { if (tracking()) backAttempt(); });
  window.addEventListener('pagehide', () => { if (tracking()) { attempt.lastSeen = Date.now(); saveAttempt(); } });
  ['copy', 'cut'].forEach(t => document.addEventListener(t, e => { if (!tracking()) return; attempt.stats.copies++; ev(t, 'tried to ' + t + ' text'); if (attempt.hw && attempt.hw.blockCopy !== false) e.preventDefault(); }));
  document.addEventListener('paste', () => { if (!tracking()) return; attempt.stats.pastes++; ev('paste', 'pasted into the page'); });
  document.addEventListener('contextmenu', e => { if (!tracking()) return; attempt.stats.menus++; ev('right-click', ''); if (attempt.hw && attempt.hw.blockCopy !== false) e.preventDefault(); });
  window.addEventListener('beforeprint', () => { if (!tracking()) return; attempt.stats.prints++; ev('print', 'print dialog opened'); });
  document.addEventListener('keydown', e => {
    if (!tracking()) return;
    const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (k === 'printscreen' || (mod && (k === 'p' || k === 's')) || (e.metaKey && e.shiftKey && ['3', '4', '5', 's'].includes(k))) { attempt.stats.prints++; ev('shortcut', (mod ? 'Ctrl/Cmd+' : '') + (e.key || '')); }
  });
}


function guardBack() { if (!history.state || !history.state.quiz) history.pushState({ quiz: 1 }, ''); }
function backAttempt() {
  if (!tracking()) return;
  if (confirm('Leave the quiz? The timer keeps running, and leaving is reported to your teacher.')) {
    ev('exited to menu', 'back button'); attempt.lastSeen = Date.now(); saveAttempt(); attempt = null; view = 'home'; render();
  } else history.pushState({ quiz: 1 }, '');
}
// the student's name faintly repeated over the quiz, so a leaked screenshot shows whose it is
function syncWatermark() {
  let el = document.getElementById('wm');
  if (!tracking()) { if (el) el.remove(); document.body.classList.remove('cover'); return; }
  if (!el) { el = document.createElement('div'); el.id = 'wm'; el.setAttribute('aria-hidden', 'true'); el.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;pointer-events:none;'; document.body.appendChild(el); }
  const txt = (attempt.name + ' · ' + attempt.cls).slice(0, 34).replace(/[<>&"']/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;' }[c]));
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220"><text x="20" y="120" transform="rotate(-24 190 110)" font-family="sans-serif" font-size="19" font-weight="700" fill="rgb(140,140,150)" fill-opacity="0.17">' + txt + '</text></svg>';
  el.style.backgroundImage = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';

  if (!API() && CONFIG.MODE === 'student') body = connectBox();
  else if (!API()) body = `<div class="rounded-xl p-3 text-sm border border-warn/40 bg-warn/10 text-warn">This app isn't connected to your teacher's Google Sheet yet. Tell your teacher.</div>`;
  else if (!classesData && classesLoading) body = spinner('Loading your classes…');

  else {
    const hwHtml = !stuClass ? '' : !cur ? `<p class="text-sm text-mute mt-4">That class no longer exists. Choose another.</p>`
      : !cur.homework.length ? `<p class="text-sm text-mute mt-4">No homework for ${esc(cur.name)} right now.</p>`
      : `<div class="mt-5 space-y-3">${cur.homework.map(h => `
        <div class="rounded-xl border border-line bg-sunk p-4">
          <div class="font-semibold">${esc(h.title)}</div>
          <div class="flex flex-wrap gap-1.5 mt-2">${kindChips(h)}${h.minutes ? `<span class="chip">⏱ ${h.minutes} min</span>` : ''}${dueChip(h)}</div>

        <button data-act="loadSheet" class="btn btn-ghost mt-3" ${d.loading ? 'disabled' : ''}>${d.loading ? 'Loading…' : 'Load questions'}</button>`
      : `
        <div class="flex items-center justify-between gap-3 flex-wrap mt-3"><p class="text-sm text-mute">Columns: <b class="text-ink">Question</b>, <b class="text-ink">Option A–H</b>, <b class="text-ink">Answer</b>, optional <b class="text-ink">Points</b>.</p><button data-act="template" class="btn btn-ghost">Download template</button></div>
        <label id="drop" for="dfile" class="mt-3 block cursor-pointer rounded-2xl border-2 border-dashed border-line hover:border-accent transition p-8 text-center"><div class="font-semibold">Drop a spreadsheet here, or tap to choose</div><div class="text-xs text-faint mt-1">Only the first sheet is used.</div></label>
        <input id="dfile" type="file" class="hidden" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv">`}
      ${d.err ? `<div class="mt-3 text-sm text-bad">${esc(d.err)}</div>` : ''}
      ${d.questions ? `<div class="mt-4 rounded-xl border border-good/40 bg-good/5 p-3 text-sm text-good">✓ ${d.questions.length} question${d.questions.length > 1 ? 's' : ''} loaded from ${esc(d.sourceLabel)}${d.summary ? `<div class="text-xs text-mute mt-1">${esc(d.summary)}</div>` : ''}</div>
        ${d.warnings.length ? `<div class="mt-3 rounded-xl border border-warn/40 bg-warn/10 p-3 text-sm text-warn"><b>${d.warnings.length} note${d.warnings.length > 1 ? 's' : ''} about your spreadsheet</b><ul class="list-disc ml-5 mt-1 space-y-0.5">${d.warnings.slice(0, 8).map(w => `<li>${esc(w)}</li>`).join('')}${d.warnings.length > 8 ? `<li>…and ${d.warnings.length - 8} more</li>` : ''}</ul></div>` : ''}
        <details class="mt-3"><summary class="cursor-pointer text-sm text-accent-text font-semibold">Preview questions</summary><ul class="mt-2">${questionPreview(d.questions)}</ul></details>` : ''}
    </section>`}
    <section class="card">
      <h2 class="text-lg font-bold">2. Details</h2>
      <label class="label mt-3" for="dTitle">Title</label>
      <input id="dTitle" data-d="title" class="input" maxlength="80" placeholder="e.g. Unit 3 homework" value="${esc(d.title)}">
      <div class="label mt-4">Give it to</div>
      <div class="grid sm:grid-cols-2 gap-2">${classes.map(c => `<label class="flex items-center gap-3 rounded-xl bg-sunk border border-line px-4 py-3 cursor-pointer"><input type="checkbox" data-dc="${esc(c)}" class="w-4 h-4" style="accent-color:rgb(var(--accent))" ${d.classes.includes(c) ? 'checked' : ''}> ${esc(c)}</label>`).join('')}</div>
      <div class="mt-4 grid sm:grid-cols-2 gap-4">
        <div><label class="label" for="dDl">Deadline (your local time, optional)</label><input id="dDl" data-d="deadlineLocal" type="datetime-local" class="input" value="${esc(d.deadlineLocal)}"></div>
        <div><label class="label" for="dMin">Time limit (minutes, 0 = none)</label><input id="dMin" data-d="minutes" type="number" min="0" max="300" class="input" value="${d.minutes}"></div>
      </div>
      <div class="mt-4 grid sm:grid-cols-2 gap-3 text-sm">
        ${chk('allowLate', 'Allow late submissions (marked LATE)')}${chk('blockCopy', 'Block copying &amp; right-click')}
        ${d.kind === 'quiz' ? chk('shuffleQ', 'Shuffle question order') + chk('shuffleO', 'Shuffle answer options') : ''}
        ${d.kind === 'writing' ? '' : chk('showReview', 'Show students the correct answers after they submit', true)}
      </div>
    </section>
    <button data-act="issue" class="btn btn-primary w-full" style="padding:1rem;font-size:1rem" ${d.issuing ? 'disabled' : ''}>${d.issuing ? 'Issuing…' : 'Issue homework'}</button></div>`;
}

/* ----- student: quiz + result ----- */
function quizView() {
  if (attempt.kind === 'reading') return readingView();
  if (attempt.kind === 'writing') return writingView();
  const Q = attempt.quiz;
  const isT = qi => Q.questions[qi].type === 'text';
  attempt.order = attempt.order.filter(x => !isT(x.qi)).concat(attempt.order.filter(x => isT(x.qi)));
  const nMc = attempt.order.filter(x => !isT(x.qi)).length;
  const twoParts = nMc > 0 && nMc < attempt.order.length;      // multiple choice on page 1, short answers on page 2
  const part = twoParts ? Math.min(attempt.part || 0, 1) : 0;
  const cards = attempt.order.map(({ qi, o }, n) => ({ qi, o, n })).filter(x => !twoParts || (part === 0) === !isT(x.qi)).map(({ qi, o, n }) => {
    const q = Q.questions[qi];
    return `<section class="card">
      <div class="flex gap-3">
        <div class="shrink-0 w-8 h-8 rounded-lg bg-sunk border border-line grid place-items-center text-sm font-bold text-accent-text">${n + 1}</div>
        <h3 class="font-semibold text-lg leading-snug pt-0.5">${esc(q.q)}</h3>
      </div>
      ${q.type === 'text' ? typedInput(qi) : ''}
      <div class="mt-4 space-y-2.5">
        ${o.map((oi, d) => `
          <label class="block cursor-pointer opt">
            <input type="radio" class="sr-only" name="q${qi}" data-q="${qi}" value="${oi}" ${attempt.answers[qi] === oi ? 'checked' : ''}>
            <div class="optbox">
              <span class="shrink-0 w-7 h-7 rounded-full border border-line grid place-items-center text-xs font-bold text-mute">${LETTERS[d]}</span>
              <span class="text-[15px]">${esc(q.options[oi])}</span>
            </div></label>`).join('')}
      </div></section>`;
  }).join('');
  return `<div class="-mx-4 -mt-8 sm:-mt-10 px-4 py-3 sticky top-14 z-20 bg-bg/90 backdrop-blur border-b border-line">
      <div class="max-w-3xl mx-auto">
        <div class="flex items-center justify-between text-sm gap-3"><div class="truncate"><span class="text-faint">Student</span> <b>${esc(attempt.name)}</b> <span class="text-faint">· ${esc(attempt.cls)}</span></div><div id="timer" class="font-mono"></div></div>
        <div class="mt-2 h-2 rounded-full bg-sunk border border-line overflow-hidden"><div id="bar" class="h-full bg-accent transition-all duration-300" style="width:0%"></div></div>
        <div id="progressText" class="mt-1 text-xs text-mute"></div>
      </div></div>
    <div class="max-w-3xl mx-auto mt-6 space-y-5 ${attempt.hw.blockCopy ? 'noselect' : ''}">
      <h1 class="text-2xl font-extrabold tracking-tight">${esc(Q.title)}</h1>
      <p class="text-xs text-faint -mt-3">Your name is shown faintly over this quiz. Screenshots, copying and leaving the page are recorded and sent to your teacher.</p>
      ${twoParts ? `<div class="text-sm font-bold text-accent-text -mb-2">Part ${part + 1} of 2 · ${part === 0 ? 'Multiple choice' : 'Short answers'}</div>` : ''}
      ${(!twoParts || part === 1) && Q.questions.some(q => q.type === 'text') ? `<p class="text-sm text-mute -mt-2">For typed answers, spelling counts but capital letters don't.</p>` : ''}
      ${cards}
      ${twoParts && part === 0 ? `<button data-act="nextPart" class="btn btn-primary w-full" style="padding:1rem;font-size:1rem">Next: short answers →</button>`
        : twoParts ? `<div style="display:grid;grid-template-columns:1fr 2fr;gap:.75rem"><button data-act="prevPart" class="btn btn-ghost" style="padding:1rem">← Back</button><button data-act="submit" class="btn btn-primary" style="padding:1rem;font-size:1rem">Submit answers</button></div>`
        : `<button data-act="submit" class="btn btn-primary w-full" style="padding:1rem;font-size:1rem">Submit answers</button>`}
    </div>`;
}

function resultView() {
  if (lastReview.rec.kind === 'writing') return writingResultView();
  const r = lastReview.rec, Q = lastReview.quiz;
  const col = r.percent >= 80 ? 'good' : r.percent >= 50 ? 'warn' : 'bad';
  const C = 2 * Math.PI * 52;
  const msg = r.percent >= 90 ? 'Outstanding!' : r.percent >= 75 ? 'Great work!' : r.percent >= 50 ? 'Good effort. Keep practising.' : 'Keep going. Review and try again.';
  const review = lastReview.hw.showReview ? lastReview.order.map(({ qi }, n) => {
    const q = Q.questions[qi]; const given = lastReview.answers[qi]; const ok = isRight(q, given), isT = q.type === 'text';
    return `<li class="rounded-xl border ${ok ? 'border-good/40 bg-good/5' : 'border-bad/40 bg-bad/5'} p-4">
      <div class="font-medium text-sm"><span class="text-faint">${n + 1}.</span> ${esc(q.q)}</div>
      <div class="mt-2 text-sm ${ok ? 'text-good' : 'text-bad'}">${ok ? '✓' : '✗'} Your answer: ${given === undefined ? '<i>no answer</i>' : esc(isT ? given : q.options[given])}</div>
      ${ok ? '' : `<div class="mt-1 text-sm text-good">Correct answer: ${esc(isT ? q.answers.join(' / ') : q.options[q.answer])}</div>`}
    </li>`;
  }).join('') : '';
  return `<div class="max-w-2xl mx-auto">
    <section class="card text-center">
      <div class="text-sm text-mute">${esc(r.name)} · ${esc(r.cls)}</div>
      <div class="relative w-40 h-40 mx-auto mt-3">
        <svg viewBox="0 0 120 120" class="w-40 h-40 -rotate-90"><circle cx="60" cy="60" r="52" fill="none" stroke="rgb(var(--line))" stroke-width="10"/><circle cx="60" cy="60" r="52" fill="none" stroke="rgb(var(--${col}))" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - r.percent / 100)}"/></svg>
        <div class="absolute inset-0 grid place-items-center"><div class="text-4xl font-extrabold">${r.percent}%</div></div>
      </div>
      <div class="mt-4 text-2xl font-bold">${fmt(r.score)} / ${fmt(r.total)} points</div>
      <div class="text-mute mt-1">${r.correct} of ${r.questions} correct</div>
      <div class="mt-3 font-semibold text-${col}">${msg}</div>
      ${r.late ? `<div class="mt-3">${badge('Submitted after the deadline (LATE)', 'warn')}</div>` : ''}
      ${r.integrity && r.integrity.flagged ? `<div class="mt-4 rounded-xl border border-warn/40 bg-warn/10 text-warn text-sm p-3 text-left"><b>Noted for your teacher:</b> ${esc(r.integrity.summary)}</div>` : ''}
      <div id="sendStatus"></div>
      <button data-act="home" class="btn btn-primary mt-6">Done</button>
    </section>
    ${review ? `<h2 class="mt-8 mb-3 text-lg font-bold">Review</h2><ul class="space-y-3">${review}</ul>` : ''}
  </div>`;
}

/* ---------- reading and writing assignments ---------- */
const ICON_BOOK = '<svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';
const ICON_PEN = '<svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>';
const ICON_LIST = '<svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>';

const kindOf = h => (h && h.kind) || 'quiz';
let kindId = 0, lastTick = 0, essayTimer = 0;
const paraList = t => String(t || '').split(/\n+/).map(s => s.trim()).filter(Boolean);

/* ----- labels used in lists and cards ----- */
const kindTag = h => kindOf(h) === 'reading' ? badge('Reading', 'good') : kindOf(h) === 'writing' ? badge('Writing', 'warn') : '';
const kindChips = h => kindOf(h) === 'writing' ? '<span class="chip">Writing task</span>'
  : (kindOf(h) === 'reading' ? '<span class="chip">Reading</span>' : '') + `<span class="chip">${h.count} questions</span>`;
const hwCountText = h => kindOf(h) === 'writing' ? 'writing task' : `${h.count} questions`;
const essaysBtn = h => kindOf(h) === 'writing' ? `<button data-act="hwEssays" data-v="${esc(h.id)}" class="btn btn-ghost">Essays</button>` : '';
const scoreCell = r => r.kind === 'writing'
  ? `<span title="Automatic check, out of 100">Auto ${fmt(r.autoScore === null ? r.score : r.autoScore)}</span>${r.aiScore !== null && r.aiScore !== undefined ? ` <span class="text-faint">·</span> AI ${fmt(r.aiScore)}` : ''}${r.teacherScore !== null && r.teacherScore !== undefined ? ` <span class="text-faint">·</span> You ${fmt(r.teacherScore)}` : ''}`
  : `${fmt(r.score)}/${fmt(r.total)} <span class="text-faint">(${r.percent}%)</span>`;
const kindBadgeRow = r => r.kind === 'reading' ? badge('Reading', 'good') + ' ' : r.kind === 'writing' ? badge('Writing', 'warn') + ' ' : '';
const noteExtra = r => r.kind === 'reading' && (r.readSecs || r.qSecs) ? `<div class="text-xs text-mute">Read ${fmtDur(r.readSecs)} · questions ${fmtDur(r.qSecs)}</div>`
  : r.kind === 'writing' && r.words ? `<div class="text-xs text-mute">${r.words} words</div>` : '';

/* ====================== student: shared top bar ====================== */
const kindBar = () => `<div class="-mx-4 -mt-8 sm:-mt-10 px-4 py-3 sticky top-14 z-20 bg-bg/90 backdrop-blur border-b border-line">
  <div class="max-w-3xl mx-auto">
    <div class="flex items-center justify-between text-sm gap-3"><div class="truncate"><span class="text-faint">Student</span> <b>${esc(attempt.name)}</b> <span class="text-faint">· ${esc(attempt.cls)}</span></div><div id="timer" class="font-mono"></div></div>
    <div class="mt-2 h-2 rounded-full bg-sunk border border-line overflow-hidden"><div id="bar" class="h-full bg-accent transition-all duration-300" style="width:0%"></div></div>
    <div id="progressText" class="mt-1 text-xs text-mute"></div>
  </div></div>`;
const kindNotice = '<p class="text-xs text-faint -mt-3">Your name is shown faintly over this page. Screenshots, copying, using other apps and leaving the page are recorded and sent to your teacher.</p>';

function initKind(a) {
  a.kind = kindOf(a.hw); a.config = a.hw.config || {};
  if (a.kind === 'reading') {
    const n = (a.config.pages || []).length;
    a.stage = 'read'; a.page = 0; a.rereading = false;
    a.tm = { pages: Array.from({ length: n }, () => ({ secs: 0, visits: 0 })), qSecs: 0, rereads: 0, rereadSecs: 0 };
    if (n) a.tm.pages[0].visits = 1;
  } else if (a.kind === 'writing') { a.essay = ''; a.wstats = { bigInserts: 0, drops: 0 }; }
}

/* progress bar under the header */
function kindProgress() {
  const a = attempt, bar = $('#bar'), txt = $('#progressText'); if (!bar || !txt) return;
  if (a.kind === 'reading' && a.stage === 'read') {
    const n = a.config.pages.length; bar.style.width = ((a.page + 1) / n * 100) + '%'; txt.textContent = `Reading: page ${a.page + 1} of ${n}`;
  } else if (a.kind === 'reading') {
    const total = a.order.length, n = Object.keys(a.answers).length; bar.style.width = (total ? n / total * 100 : 0) + '%'; txt.textContent = `${n} of ${total} answered`;
  } else if (a.kind === 'writing') {
    const c = a.config, w = wordCount(a.essay), p = paraList(a.essay).length, target = c.minWords || 150;
    bar.style.width = Math.min(100, w / target * 100) + '%';
    txt.textContent = `${w} word${w === 1 ? '' : 's'}${c.minWords ? ' (at least ' + c.minWords + ')' : ''}${c.maxWords ? ' (no more than ' + c.maxWords + ')' : ''} · ${p} of ${c.maxParagraphs || 5} paragraphs`;
  }
}

/* reading time only counts while the page is on screen and in focus */
function kindStart() {
  clearInterval(kindId);
  if (!(view === 'quiz' && attempt && !attempt.done && attempt.kind === 'reading')) return;
  lastTick = Date.now();
  kindId = setInterval(() => {
    const now = Date.now(), dt = Math.min(3000, now - lastTick); lastTick = now;
    if (!attempt || attempt.done || document.hidden || leaveStart) return;
    const tm = attempt.tm;
    if (attempt.stage === 'read') { const p = tm.pages[attempt.page]; if (p) p.secs += dt / 1000; }
    else { tm.qSecs += dt / 1000; if (attempt.rereading) tm.rereadSecs += dt / 1000; }
  }, 1000);
}
function kindAfterRender() { kindStart(); if (attempt && attempt.kind === 'writing') loadWords(); }

/* ====================== student: reading ====================== */
const paraStart = (c, page) => c.pages.slice(0, page).reduce((n, p) => n + p.split('\n\n').length, 0);
function passagePage(c, page) {
  const base = paraStart(c, page);
  return c.pages[page].split('\n\n').map((p, i) => `<div class="flex gap-3">${c.labels !== false ? `<div class="shrink-0 w-7 h-7 rounded-md bg-sunk border border-line grid place-items-center text-xs font-bold text-accent-text mt-0.5">${esc((c.paraLabels || [])[base + i] || String.fromCharCode(65 + ((base + i) % 26)))}</div>` : ''}<p class="leading-relaxed text-[15px] min-w-0">${esc(p)}</p></div>`).join('');
}
function readingView() {
  const a = attempt, c = a.config;
  let body;
  if (a.stage === 'read') {
    const last = a.page >= c.pages.length - 1;
    body = `<div class="text-sm font-bold text-accent-text -mb-2">Reading · page ${a.page + 1} of ${c.pages.length}</div>
      <section class="card space-y-4" id="passage">${passagePage(c, a.page)}</section>
      <div style="display:grid;grid-template-columns:${a.page > 0 ? '1fr 2fr' : '1fr'};gap:.75rem">
        ${a.page > 0 ? '<button data-act="rdPrev" class="btn btn-ghost" style="padding:1rem">← Back</button>' : ''}
        <button data-act="${last ? 'rdStart' : 'rdNext'}" class="btn btn-primary" style="padding:1rem;font-size:1rem">${last ? 'Start the questions →' : 'Next page →'}</button></div>`;
  } else if (a.rereading) {
    body = `<div class="text-sm font-bold text-accent-text -mb-2">The passage</div>
      ${c.pages.map((_, i) => `<section class="card space-y-4">${c.pages.length > 1 ? `<div class="text-xs text-faint">Page ${i + 1}</div>` : ''}${passagePage(c, i)}</section>`).join('')}
      <button data-act="rdBack" class="btn btn-primary w-full" style="padding:1rem;font-size:1rem">← Back to the questions</button>`;
  } else body = readingQuestions();
  return `${kindBar()}<div class="max-w-3xl mx-auto mt-6 space-y-5 ${a.hw.blockCopy ? 'noselect' : ''}">
    <h1 class="text-2xl font-extrabold tracking-tight">${esc(a.quiz.title)}</h1>${kindNotice}${body}</div>`;
}
function readingQuestions() {
  const a = attempt, c = a.config, Q = a.quiz;
  const cards = a.order.map(({ qi, o }, n) => {
    const q = Q.questions[qi];
    const sec = (c.sections || []).find(s => s.start === qi + 1);
    const inMatch = q.style === 'match' || !!(c.sections || []).find(s => s.style === 'match' && qi + 1 >= s.start && qi + 1 <= s.end);
    const head = sec ? `<div class="pt-2"><h2 class="text-lg font-bold">${esc(sec.title)}</h2>${sec.style === 'match' ? `<ul class="mt-2 rounded-xl border border-line bg-sunk p-3 text-sm space-y-1">${q.options.map((t, j) => `<li><b class="text-accent-text">${LETTERS[j]}</b> ${esc(t)}</li>`).join('')}</ul>` : ''}</div>` : '';
    let input;
    if (q.type === 'text') input = typedInput(qi) + (c.maxWords ? `<div class="text-xs text-faint mt-1.5">No more than ${c.maxWords} word${c.maxWords > 1 ? 's' : ''}.</div>` : '');
    else if (inMatch) input = `<div class="mt-4"><label class="sr-only" for="m${qi}">Your answer</label><select id="m${qi}" data-m="${qi}" class="input"><option value="">Choose A–${LETTERS[q.options.length - 1]}</option>${q.options.map((_, j) => `<option value="${j}" ${a.answers[qi] === j ? 'selected' : ''}>${LETTERS[j]}</option>`).join('')}</select></div>`;
    else input = `<div class="mt-4 space-y-2.5">${o.map((oi, d) => `<label class="block cursor-pointer opt"><input type="radio" class="sr-only" name="q${qi}" data-q="${qi}" value="${oi}" ${a.answers[qi] === oi ? 'checked' : ''}><div class="optbox"><span class="shrink-0 w-7 h-7 rounded-full border border-line grid place-items-center text-xs font-bold text-mute">${LETTERS[d]}</span><span class="text-[15px]">${esc(q.options[oi])}</span></div></label>`).join('')}</div>`;
    return head + `<section class="card"><div class="flex gap-3"><div class="shrink-0 w-8 h-8 rounded-lg bg-sunk border border-line grid place-items-center text-sm font-bold text-accent-text">${n + 1}</div><h3 class="font-semibold text-lg leading-snug pt-0.5">${esc(q.q)}</h3></div>${input}</section>`;
  }).join('');
  return `<div class="text-sm font-bold text-accent-text -mb-2">Questions</div>
    ${c.allowReread ? '<button data-act="rdView" class="btn btn-ghost w-full">View the passage</button>' : '<p class="text-sm text-mute -mt-2">You cannot go back to the passage.</p>'}
    ${cards}
    <button data-act="submit" class="btn btn-primary w-full" style="padding:1rem;font-size:1rem">Submit answers</button>`;
}
function rdGo(page) {
  const a = attempt; if (!a || a.kind !== 'reading') return;
  a.page = page; a.tm.pages[page].visits++; ev('page', 'opened passage page ' + (page + 1) + ' of ' + a.config.pages.length);
  saveAttempt(); render(); window.scrollTo(0, 0);
}
function rdStart() {
  const a = attempt; if (!a || a.kind !== 'reading') return;
  if (!a.config.allowReread && !confirm('You will not be able to read the passage again. Start the questions?')) return;
  a.stage = 'questions'; a.rereading = false; ev('page', 'started the questions'); saveAttempt(); render(); window.scrollTo(0, 0);
}
function rdView(on) {
  const a = attempt; if (!a || a.kind !== 'reading') return;
  a.rereading = on; if (on) { a.tm.rereads++; ev('page', 'looked at the passage again'); } saveAttempt(); render(); window.scrollTo(0, 0);
}

/* what gets sent with a reading result: time on every page, time on the questions, and which pages were too quick */
function kindExtra(a) {
  if (a.kind !== 'reading') return {};
  const c = a.config, tm = a.tm; let readSecs = 0;
  const pages = tm.pages.map((p, i) => {
    const words = wordCount(c.pages[i]); readSecs += p.secs;
    return { n: i + 1, secs: Math.round(p.secs), visits: p.visits, words, fast: p.secs < words / (c.wpm || 900) * 60 };

  let order = idx.map(qi => { const o = questions[qi].options.map((_, i) => i); if (hw.shuffleO && !questions[qi].style && kindOf(hw) !== 'reading') shuffle(o); return { qi, o }; });

function endTime() {

function startTimer() {

    const left = Math.max(0, end - Date.now());

  const Q = attempt.quiz, hw = attempt.hw;

function doUnlock() {

  const f = LS.get('rca.fails', { n: 0, until: 0 });
  if (Date.now() < f.until) { msg.textContent = `Too many attempts. Try again in ${Math.ceil((f.until - Date.now()) / 1000)}s.`; return; }
  if (!pw) { msg.textContent = 'Enter the password.'; return; }
  msg.textContent = 'Checking…';
  setTimeout(() => {
    if (hashPw(pw) === CONFIG.TEACHER_PASSWORD_HASH) { LS.del('rca.fails'); unlocked = true; teacherPw = pw; view = 'teacher'; render(); refreshAdmin(); }
    else {
      const n = f.n + 1, wait = n >= 3 ? Math.min(300, 10 * Math.pow(2, n - 3)) : 0;
      LS.set('rca.fails', { n, until: wait ? Date.now() + wait * 1000 : 0 });

}

  if (t.id === 'dfile') { handleDraftFile(t.files[0]); t.value = ''; return; }
  if (ds.dc !== undefined && draft) { draft.classes = draft.classes.filter(c => c !== ds.dc); if (t.checked) draft.classes.push(ds.dc); }
  if (ds.st === 'cls') { stuClass = t.value; LS.set('rca.stuClass', stuClass); render(); }
  if (t.matches && t.matches('input[type=radio][data-q]') && attempt) {
    attempt.answers[+t.dataset.q] = +t.value; saveAttempt(); updateProgress();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSettings(); closeModal(); }
  if (e.key !== 'Enter') return;
  if (e.target.id === 'pwIn') $('[data-act="unlock"]').click();
  if (e.target.id === 'newClass') $('[data-act="saveClass"]').click();
  if (e.target.id === 'dUrl') $('[data-act="loadSheet"]').click();
});
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('#drop')) { e.preventDefault(); $('#drop').classList.add('border-accent'); } }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('border-accent'); if (ev === 'drop') handleDraftFile(e.dataTransfer.files[0]); } }));
window.addEventListener('online', retryPending);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });

/* ---------- always look for a newer version ---------- */
// Every build has its own stamp. On opening the app (and when coming back to it) the page asks the server for
// the latest index.html, ignoring anything saved on the phone, and reloads itself if the stamp has changed.
// It never reloads in the middle of a quiz or while the teacher is working: it waits for the home screen.
const APP_BUILD = '20261029-072529';
let updateTold = false;
const safeToReload = () => !(attempt && !attempt.done) && ['home', 'studentStart', 'teacherLogin'].includes(view);
async function checkForUpdate() {
  if (CONFIG.MODE === 'teacher') return;
  if (!location.protocol.startsWith('http') || navigator.onLine === false) return;
  try {
    const r = await fetch(location.pathname, { cache: 'reload' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const APP_BUILD = '([^']+)'/);
    if (!m || m[1] === APP_BUILD) return;
    if (!safeToReload()) { if (!updateTold) { updateTold = true; toast('A new version is ready. It loads when you go back to the home screen.'); } return; }
    try { if (sessionStorage.getItem('rca.updTried') === m[1]) return; sessionStorage.setItem('rca.updTried', m[1]); } catch {}   // never loop
    try { (await caches.keys()).forEach(k => caches.delete(k)); } catch {}
    try { (await navigator.serviceWorker.getRegistrations()).forEach(g => g.unregister()); } catch {}
    location.reload();
  } catch {}
}

/* ---------- boot ---------- */
(function init() {
  installGuards();
  adoptLink();
  if (location.hash === '#hash' && CONFIG.MODE !== 'student') view = 'hashtool';
  const saved = LS.get('rca.attempt', null);
  if (saved && (saved.done || !saved.quiz || !saved.hw || Date.now() - saved.startedAt > 12 * 3600 * 1000)) LS.del('rca.attempt');
  LS.del('rca.quiz');
  render();
  retryPending();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && CONFIG.MODE !== 'teacher') {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => reg.update().catch(() => {})).catch(() => {});
  }
  checkForUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
})();
</script>
